<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
        }

        header nav a:hover {
            color: #38bdf8;
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        p {
            margin-bottom: 1rem;
            color: #4b5563;
        }

        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #e2e8f0;
            color: #64748b;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h2>My Project</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h1>Welcome to My Website</h1>
            <p>This is a lightweight, responsive template designed to render cleanly on both mobile and desktop screens.</p>
            <a href="#" class="btn">Get Started</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 My Project. All rights reserved.</p>
    </footer>

</body>
</html>
